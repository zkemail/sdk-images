name: Circom Rust tests

on:
  push:
    branches:
      - main
      - staging
    paths:
      - 'circom/**'
      - 'sdk-utils/**'
      - 'Cargo.toml'
  pull_request:
    branches:
      - main
      - staging
    paths:
      - 'circom/**'
      - 'sdk-utils/**'
      - 'Cargo.toml'
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install protoc
        # Required by prost-wkt-types' build script (a transitive dependency); without it,
        # compiling the crate's own test binary fails before any test runs.
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install circom
        # Prebuilt binary (matches circom/Dockerfile's pinned v2.1.9) instead of building from
        # source: ~seconds instead of ~2 minutes for a cold `cargo build --release` of circom
        # itself, which has nothing to do with this crate's own build cache.
        run: |
          curl -L -o /usr/local/bin/circom https://github.com/iden3/circom/releases/download/v2.1.9/circom-linux-amd64
          chmod +x /usr/local/bin/circom

      - name: Run circom crate tests
        # Scoped to contract:: only (fast, pure-Rust unit tests, no circom/yarn involved).
        # The full suite (including main.rs's test_compile_circuit_* integration tests,
        # each of which does a real circom compile + a fresh `yarn install` into a shared
        # ./tmp) was getting the job cancelled ~7-8 min in on every attempt: target/ alone
        # runs to ~16GB on a cold build, comfortably over the 14GB disk budget on standard
        # GitHub-hosted runners. See ZK-1454 for bringing the full suite back within budget.
        run: cargo test -p circom "contract::"
